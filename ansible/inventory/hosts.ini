# All roles run against the local control node by default (agents install on this host,
# AWS calls go out through the `coaa` profile). Point [agent_hosts] at a remote box to
# provision a shared dev workstation instead.
[agent_hosts]
localhost ansible_connection=local

[agent_hosts:vars]
# auto_silent lets ansible discover the local python3 (override per-host if needed)
ansible_python_interpreter=auto_silent
